name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  # BiRefNet has no ready-made Core ML form. Its two models (the subject, and hair matting)
  # are converted here, on Linux, once; the results are kept between builds in the cache,
  # which the Mac job reads too, and compiles them into the app. (They were handed over as
  # an artifact until alpha 18, when the repository's artifact storage ran out.) This is the only step that fetches anything
  # (the models' published weights); the app never does.
  birefnet:
    name: Convert BiRefNet (Linux, kept between builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: kept
        with:
          path: |
            BiRefNet.mlpackage
            BiRefNetMatting.mlpackage
          key: birefnet-two-${{ hashFiles('tools/convert_birefnet.py') }}
          enableCrossOsArchive: true
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The conversion needs more memory than this machine has; the rest comes from the disk.
      - name: Convert
        if: steps.kept.outputs.cache-hit != 'true'
        timeout-minutes: 150
        env:
          SKIP_PARITY: "1"
        run: |
          # Make room first: tools this job never uses take most of the disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / /mnt || true
          sudo swapoff -a || true
          SPARE=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          SWAP=$(( SPARE - 12 )); [ "$SWAP" -gt 16 ] && SWAP=16
          echo "spare disk ${SPARE}G, swap ${SWAP}G"
          sudo fallocate -l "${SWAP}G" /traincull-swap
          sudo chmod 600 /traincull-swap && sudo mkswap /traincull-swap && sudo swapon /traincull-swap
          free -g
          pip install torch==2.15.0 torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.23.0 timm==1.0.31 kornia==0.9.1 einops==0.8.2 coremltools==9.0
          python -u tools/convert_birefnet.py convert BiRefNet.mlpackage 1024 ZhengPeng7/BiRefNet_HR
          python -u tools/convert_birefnet.py convert BiRefNetMatting.mlpackage 1024 ZhengPeng7/BiRefNet-matting

  mac:
    name: Mac app
    runs-on: macos-15
    # Built even if the conversion failed: the app then simply has no BiRefNet.
    needs: birefnet
    if: always()
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # The segmentation model the app carries, compiled once and kept between builds.
      - name: Model (kept between builds)
        uses: actions/cache@v4
        id: models
        with:
          path: build-models
          key: models-two-${{ hashFiles('scripts/fetch-models.sh', 'tools/convert_birefnet.py') }}
      # Read every time: the models kept from an earlier build may be without it. The same
      # cache entry the Linux job keeps (paths, key and cross-OS setting must match it).
      - name: BiRefNet from the Linux job
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            BiRefNet.mlpackage
            BiRefNetMatting.mlpackage
          key: birefnet-two-${{ hashFiles('tools/convert_birefnet.py') }}
          enableCrossOsArchive: true
      - name: Compile the models
        run: scripts/fetch-models.sh build-models
      # The core library's own tests run in the Linux job. Here, the ones that need a Mac,
      # the model and the whole masking pipeline among them.
      - name: Tests
        timeout-minutes: 30
        run: TRAINCULL_MODELS="$PWD/build-models" swift test --filter TrainCullTests
      # Alpha numbers follow on from the last published one (alpha 4 came from the earlier
      # repository), so a failed build never uses a number up.
      - name: Build number
        id: number
        run: |
          LAST=$(gh release list --limit 200 --json tagName \
            --jq '[.[].tagName | select(startswith("alpha-")) | ltrimstr("alpha-") | tonumber] | max // 4')
          echo "value=$((LAST + 1))" >> "$GITHUB_OUTPUT"
          echo "Building alpha $((LAST + 1))"
      - name: Build the app
        run: scripts/make-app.sh "${{ steps.number.outputs.value }}"
      # Start the app on a folder of made-up frames (no photos are kept in the repository),
      # in the single view, side by side and in edit mode, and keep a picture of each.
      - name: Launch check
        run: |
          swift scripts/make-fixture.swift "$PWD/build/fixture"
          shoot() { # <picture name> <seconds to wait> [arguments]
            open -n build/TrainCull.app --args -TCOpenFolder "$PWD/build/fixture" "${@:3}"
            sleep "$2"
            pgrep -x TrainCull
            screencapture -x "build/$1.png" || true
            pkill -x TrainCull || true
            sleep 2
          }
          shoot launch 12
          shoot launch-compare 12 -TCCompare YES
          # Entering Edit mode makes the model ready; long enough for the log to show that.
          shoot launch-edit 75 -TCEdit YES
          echo "---- the app's own log ----"
          cat "$HOME/Library/Logs/TrainCull/"*.log || true
          mkdir -p build/logs && cp "$HOME/Library/Logs/TrainCull/"*.log build/logs/ || true
      # The app itself is not kept as an artifact: it is on the release (and the copies used
      # up the repository's artifact storage). The pictures and log are small, and never
      # stop a release if storage is short.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: launch-screenshot
          retention-days: 14
          path: |
            build/launch.png
            build/launch-compare.png
            build/launch-edit.png
            build/logs
          if-no-files-found: ignore
      # A full release, not a pre-release, so that
      # https://github.com/<owner>/<repo>/releases/latest/download/TrainCull.dmg
      # always downloads the newest build.
      # Archived branch: only main and version tags publish, so a push here never replaces the
      # download.
      - name: Publish
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          N="${{ steps.number.outputs.value }}"
          gh release create "alpha-$N" build/TrainCull.dmg \
            --latest \
            --target "$GITHUB_SHA" \
            --title "TrainCull 0.1.0 alpha $N" \
            --notes-file packaging/RELEASE_NOTES.md
