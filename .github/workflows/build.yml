name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  # BiRefNet has no ready-made Core ML form. It is converted here, on Linux, once; the result
  # is kept between builds and handed to the Mac job, which compiles it into the app.
  birefnet:
    name: Convert BiRefNet (Linux, kept between builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: kept
        with:
          path: BiRefNet.mlpackage
          key: birefnet-${{ hashFiles('tools/convert_birefnet.py') }}
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The conversion needs more memory than this machine has; the rest comes from the disk.
      - name: Convert
        if: steps.kept.outputs.cache-hit != 'true'
        timeout-minutes: 150
        env:
          SKIP_PARITY: "1"
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 20G /mnt/traincull-swap || sudo dd if=/dev/zero of=/mnt/traincull-swap bs=1M count=20480
          sudo chmod 600 /mnt/traincull-swap && sudo mkswap /mnt/traincull-swap && sudo swapon /mnt/traincull-swap
          free -g
          pip install torch==2.15.0 torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.23.0 timm==1.0.31 kornia==0.9.1 einops==0.8.2 coremltools==9.0
          python -u tools/convert_birefnet.py convert BiRefNet.mlpackage
      - uses: actions/upload-artifact@v4
        with:
          name: birefnet
          path: BiRefNet.mlpackage
          retention-days: 2

  mac:
    name: Mac app
    runs-on: macos-15
    # Built even if the conversion failed: the app then simply has no BiRefNet.
    needs: birefnet
    if: always()
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # The segmentation models the app carries. Fetched and compiled once, then kept between
      # builds; scripts/fetch-models.sh says which they are.
      - name: Models (kept between builds)
        uses: actions/cache@v4
        id: models
        with:
          path: build-models
          key: models-${{ hashFiles('scripts/fetch-models.sh', 'tools/convert_birefnet.py') }}
      - name: BiRefNet from the Linux job
        if: steps.models.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: birefnet
          path: BiRefNet.mlpackage
      - name: Fetch and compile models
        run: scripts/fetch-models.sh build-models
      # The core library's own tests run in the Linux job. Here, the ones that need a Mac.
      - name: Tests
        run: TRAINCULL_MODELS="$PWD/build-models" swift test --filter TrainCullTests
      # BiRefNet at full size may be more than a build machine can run; a failure here is
      # reported but does not stop the build.
      - name: BiRefNet check
        continue-on-error: true
        timeout-minutes: 12
        run: TRAINCULL_MODELS="$PWD/build-models" TRAINCULL_HEAVY_MODELS=1 swift test --filter TrainCullTests/testBiRefNetFindsTheSubject
      # Alpha numbers follow on from the last published one (alpha 4 came from the earlier
      # repository), so a failed build never uses a number up.
      - name: Build number
        id: number
        run: |
          LAST=$(gh release list --limit 200 --json tagName \
            --jq '[.[].tagName | select(startswith("alpha-")) | ltrimstr("alpha-") | tonumber] | max // 4')
          echo "value=$((LAST + 1))" >> "$GITHUB_OUTPUT"
          echo "Building alpha $((LAST + 1))"
      - name: Build the app
        run: scripts/make-app.sh "${{ steps.number.outputs.value }}"
      # Start the app on a folder of made-up frames (no photos are kept in the repository),
      # in the single view, side by side and in edit mode, and keep a picture of each.
      - name: Launch check
        run: |
          swift scripts/make-fixture.swift "$PWD/build/fixture"
          shoot() {
            open -n build/TrainCull.app --args -TCOpenFolder "$PWD/build/fixture" "${@:2}"
            sleep 12
            pgrep -x TrainCull
            screencapture -x "build/$1.png" || true
            pkill -x TrainCull || true
            sleep 2
          }
          shoot launch
          shoot launch-compare -TCCompare YES
          shoot launch-edit -TCEdit YES
          echo "---- the app's own log ----"
          cat "$HOME/Library/Logs/TrainCull/"*.log || true
          mkdir -p build/logs && cp "$HOME/Library/Logs/TrainCull/"*.log build/logs/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: TrainCull
          path: build/TrainCull.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: launch-screenshot
          path: |
            build/launch.png
            build/launch-compare.png
            build/launch-edit.png
            build/logs
          if-no-files-found: ignore
      # A full release, not a pre-release, so that
      # https://github.com/<owner>/<repo>/releases/latest/download/TrainCull.dmg
      # always downloads the newest build.
      - name: Publish
        run: |
          N="${{ steps.number.outputs.value }}"
          gh release create "alpha-$N" build/TrainCull.dmg \
            --latest \
            --target "$GITHUB_SHA" \
            --title "TrainCull 0.1.0 alpha $N" \
            --notes-file packaging/RELEASE_NOTES.md
