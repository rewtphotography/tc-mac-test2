name: Build

# Every branch builds and tests. Only `main` and version tags (v0.2.0-alpha.1 and so on)
# publish a release; see the publish job at the end. A push of a commit GitHub already has
# (such as a new branch made from another) changes no files, so starts no build: use
# Actions → Build → Run workflow for that.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test

  mac:
    name: Mac app
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.number.outputs.tag }}
      release: ${{ steps.number.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift --version
      # Which macOS each raw-filter property the panel uses first appeared in, from Apple's own header.
      - name: Raw filter API
        run: |
          H="$(xcrun --show-sdk-path)/System/Library/Frameworks/CoreImage.framework/Headers/CIRAWFilter.h"
          echo "SDK: $(xcrun --show-sdk-version)"
          sed -n '1,35p' "$H" | grep -n -E "AVAILABLE|@interface" || true
          grep -n -E "API_AVAILABLE|API_UNAVAILABLE|@interface|@property" "$H"
          echo "---- every mention of highlights, in all of Core Image's headers ----"
          grep -rn -i "highlight" "$(dirname "$H")" || echo "none"
      # The core library's own tests run in the Linux job. Here, only the ones that need a Mac,
      # among them the spec tests on the made-up DNG; their figures go in the run's summary.
      - name: Tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          # The large made-up DNG (7008 × 4672, the a7 IV's pixel count) for the preview tests.
          swift run -c release MakeDng "$RUNNER_TEMP/big.dng" 7008 4672
          TC_BIG_DNG="$RUNNER_TEMP/big.dng" swift test --filter TrainCullTests 2>&1 | tee "$RUNNER_TEMP/mac-tests.log"
          { echo "### Spec results (made-up DNG)"; grep -h "SPEC-RESULT" "$RUNNER_TEMP/mac-tests.log" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      # The version is in packaging/VERSION. A version tag gives its own alpha number; anywhere
      # else the number follows on from the last release of this version, so a failed build
      # never uses a number up. (The alpha-N tags belong to 0.1.0 and are not counted.)
      - name: Version
        id: number
        run: |
          VERSION="$(tr -d '[:space:]' < packaging/VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
            N="${TAG#v$VERSION-alpha.}"
            if [ "$N" = "$TAG" ] || ! [[ "$N" =~ ^[0-9]+$ ]]; then
              echo "error: tag $TAG does not match packaging/VERSION ($VERSION): expected v$VERSION-alpha.<number>" >&2
              exit 1
            fi
          else
            LAST=$(gh release list --limit 200 --json tagName \
              --jq "[.[].tagName | select(startswith(\"v$VERSION-alpha.\")) | ltrimstr(\"v$VERSION-alpha.\") | tonumber] | max // 0")
            N=$((LAST + 1))
            TAG="v$VERSION-alpha.$N"
          fi
          echo "alpha=$N" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$VERSION alpha $N" >> "$GITHUB_OUTPUT"
          echo "Building TrainCull $VERSION alpha $N (build ${{ github.run_number }}), tag $TAG"
      - name: Build the app
        run: scripts/make-app.sh "${{ steps.number.outputs.alpha }}" "${{ github.run_number }}"
      # B1: the same app built with the debug tools switched off compiles, has no Debug menu and
      # doesn't contain the tools; the normal build does.
      - name: Without the debug tools (B1)
        run: |
          TC_ALPHA_DEBUG=0 swift build -c release --arch arm64 --product TrainCull --build-path .build-nodebug --manifest-cache local
          OFF="$(TC_ALPHA_DEBUG=0 swift build -c release --arch arm64 --build-path .build-nodebug --manifest-cache local --show-bin-path)/TrainCull"
          ON=build/TrainCull.app/Contents/MacOS/TrainCull
          count() { { strings "$1" | grep -c -E "Run Test Script|Export Debug Package"; nm "$1" | grep -c -E "DebugRunner|DebugTools|ZipWriter|DebugScriptReader"; } | paste -sd+ - | bc; }
          echo "flag off: $(count "$OFF") debug strings and symbols; flag on: $(count "$ON")"
          if [ "$(count "$OFF")" = "0" ] && [ "$(count "$ON")" != "0" ]; then R=PASS; else R=FAIL; fi
          echo "- SPEC-RESULT B1 severability: flag off compiles; Debug menu strings and debug-tool symbols in it: $(count "$OFF"); in the normal build: $(count "$ON") — $R" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$R" = PASS ]
      - name: Size of the download
        run: |
          BYTES=$(stat -f%z build/TrainCull.dmg)
          echo "TrainCull.dmg is $BYTES bytes ($(( BYTES / 1024 )) KB)"
          echo "TrainCull.dmg: $BYTES bytes" >> "$GITHUB_STEP_SUMMARY"
      # Start the app on a folder of made-up frames (no photos are kept in the repository),
      # in the single view, side by side and in Edit mode, and keep a picture of each.
      - name: Launch check
        run: |
          swift scripts/make-fixture.swift "$PWD/build/fixture"
          mkdir -p build/fixture-dng
          swift run -c release MakeDng "$PWD/build/fixture-dng/SYNTHETIC.dng"
          shoot() { # <picture name> <folder> <seconds> [arguments]
            open -n build/TrainCull.app --args -TCOpenFolder "$PWD/build/$2" "${@:4}"
            sleep "$3"
            pgrep -x TrainCull
            screencapture -x "build/$1.png" || true
            pkill -x TrainCull || true
            sleep 2
          }
          shoot launch fixture 15
          shoot launch-compare fixture 15 -TCCompare YES
          shoot launch-edit fixture 15 -TCEdit YES
          # T12: the made-up DNG in Edit mode, driven by the app's launch-check script.
          shoot launch-script fixture-dng 50 -TCListDNG YES -TCEdit YES -TCScript YES
          # B3, B12, B13: the debug tools on the made-up DNG, with a sidecar holding edits and a
          # corrupted file beside it: a test script, two manual exports; then, after a restart,
          # one more export zoomed in.
          mkdir -p build/fixture-debug
          cp build/fixture-dng/SYNTHETIC.dng build/fixture-debug/
          head -c 4096 build/fixture-dng/SYNTHETIC.dng > build/fixture-debug/ZZ-CORRUPT.dng  # listed after SYNTHETIC.dng, which opens first
          printf '%s' '<?xpacket begin="" id="W5M0MpCehiHzreSzNTczkc9d"?><x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:crs="http://ns.adobe.com/camera-raw-settings/1.0/" xmlns:traincull="http://ns.traincull.app/1.0/" crs:Exposure2012="+0.70" traincull:ShadowBoost="1.300"/></rdf:RDF></x:xmpmeta><?xpacket end="w"?>' > build/fixture-debug/SYNTHETIC.xmp
          cat > build/selftest.json <<'EOF'
          {
            "scriptNumber": 7,
            "name": "launch-check",
            "index": ["0701: exposure +0.5, crop", "0702: Shadow bias min", "0703: Local tone map (unsupported here)", "0704: corrupted file"],
            "cases": [
              { "case": 1, "file": "SYNTHETIC.dng", "set": { "exposure": 0.5 }, "crop": [0.1, 0.1, 0.25, 0.25] },
              { "case": 2, "file": "SYNTHETIC.dng", "set": { "shadowBias": "min" } },
              { "case": 3, "file": "SYNTHETIC.dng", "set": { "localToneMapAmount": 0.5 } },
              { "case": 4, "file": "ZZ-CORRUPT.dng", "set": { "exposure": 0.2 } }
            ]
          }
          EOF
          shoot launch-debug fixture-debug 60 -TCListDNG YES -TCDebugResetCounter YES -TCDebugScript "$PWD/build/selftest.json" -TCDebugExports 2
          shoot launch-debug-zoomed fixture-debug 30 -TCListDNG YES -TCDebugZoomedExports 1
          # C1, C2, C5-C8: the performance run on the large made-up DNG, with this build's preview
          # and again the alpha 2 way, each in its own launch, until its log says it finished.
          mkdir -p build/fixture-perf
          swift run -c release MakeDng "$PWD/build/fixture-perf/BIG.dng" 7008 4672
          perf() { # <picture name> <seconds at most> [arguments]
            open -n build/TrainCull.app --args -TCOpenFolder "$PWD/build/fixture-perf" -TCListDNG YES -TCEdit YES -TCPerf YES "${@:3}"
            for i in $(seq 1 "$2"); do
              sleep 1
              if grep -q -E "perf +finished" "$(ls -t "$HOME/Library/Logs/TrainCull/"*.log | head -1)"; then echo "finished after $i s"; break; fi
            done
            screencapture -x "build/$1.png" || true
            pkill -x TrainCull || true
            sleep 2
          }
          perf launch-perf 300
          perf launch-perf-alpha2 420 -TCPreviewLegacy YES
          shasum -a 256 build/fixture-debug/SYNTHETIC.xmp
          ls -lR "$HOME/Pictures/TrainCull Debug" || true
          LOGS="$HOME/Library/Logs/TrainCull"
          echo "---- the app's own log ----"
          cat "$LOGS/"*.log || true
          echo "---- memory in Edit mode ----"
          grep -h -E "edit mode|Edit mode" "$LOGS/"*.log || true
          mkdir -p build/logs && cp "$LOGS/"*.log "$LOGS/"*.jsonl build/logs/ || true
      # Each .jsonl must hold one valid JSON object per line, the same events as its .log.
      - name: Check the JSON log
        run: |
          python3 - "$HOME/Library/Logs/TrainCull" <<'EOF'
          import json, pathlib, sys
          folder = pathlib.Path(sys.argv[1])
          logs = sorted(folder.glob("*.log"))
          assert logs, "no log was written"
          for log in logs:
              text = log.read_text().splitlines()
              lines = log.with_suffix(".jsonl").read_text().splitlines()
              assert len(text) == len(lines), f"{log.name}: {len(text)} lines but {len(lines)} JSON lines"
              for i, (plain, line) in enumerate(zip(text, lines)):
                  event = json.loads(line)
                  message = " ".join(event["message"].splitlines())
                  assert plain.endswith(message), f"{log.name} line {i + 1} differs"
                  assert plain[14:].startswith(event["category"]), f"{log.name} line {i + 1}: area differs"
              print(f"{log.name}: {len(lines)} events, every JSON line valid and matching")
          EOF
      # T12: the scripted session logs one structured line per change, and one line of Apple's
      # defaults when the file is selected.
      # B3, B12, B13 from the debug tools' launch-check runs.
      - name: Check the debug tools (B3, B12, B13)
        run: |
          set -o pipefail
          python3 - "$HOME/Library/Logs/TrainCull" "$HOME/Pictures/TrainCull Debug" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys, zipfile
          logs, root = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          events = []
          for f in sorted(logs.glob("*.jsonl")):
              events += [json.loads(l) for l in f.read_text().splitlines()]
          debug = [e for e in events if e["category"] == "debug"]
          ok = True
          iso = [e.get("fields", {}) for e in debug if e["message"].startswith("isolation")]
          if iso:
              f = iso[0]
              b3 = f["valuesBefore"] == f["valuesAfter"] and f["sidecarsBefore"] == f["sidecarsAfter"] and f["imageUnchanged"] and len(f["valuesBefore"]) > 0
              print(f"- SPEC-RESULT B3 isolation (DNG): panel values before {f['valuesBefore']}, after {f['valuesAfter']}; sidecar hashes equal: {f['sidecarsBefore'] == f['sidecarsAfter']}; image on screen unchanged: {f['imageUnchanged']} — {'PASS' if b3 else 'FAIL'}")
              ok &= b3
          else:
              print("- SPEC-RESULT B3 isolation (DNG): NOT RUN — no isolation line"); ok = False
          tests = [e.get("fields", {}) for e in debug if "status" in e.get("fields", {})]
          wanted = ["id", "file", "status", "zip", "zipSize", "renderMs"]
          full = [t for t in tests if all(k in t for k in wanted)]
          b13 = len(tests) > 0 and len(full) == len(tests)
          print(f"- SPEC-RESULT B13 logging (DNG): {len(tests)} test lines, {len(full)} with every field ({', '.join(wanted)}): " + "; ".join(f"{t['id']} {t['status']}" for t in tests) + f" — {'PASS' if b13 else 'FAIL'}")
          ok &= b13
          zips = {z.name: z for z in root.glob("script-00_*/TC-test-00*.zip")}
          contents = {n: sorted(zipfile.ZipFile(z).namelist()) for n, z in zips.items()}
          diffs = [e.get("fields", {}) for e in debug if "screenVsFrameMeanDifference" in e.get("fields", {})]
          b12 = (set(contents) == {"TC-test-0001.zip", "TC-test-0002.zip", "TC-test-0003.zip"}
                 and all("screen.png" in c and "frame.png" in c and "report.json" in c for c in contents.values())
                 and "crop.png" in contents.get("TC-test-0003.zip", []) and "crop-default.png" in contents.get("TC-test-0003.zip", [])
                 and "crop.png" not in contents.get("TC-test-0001.zip", []))
          print(f"- SPEC-RESULT B12 manual export (DNG): {contents}; screen.png vs the export at the same size, mean difference: "
                + ", ".join(f"{d['id']} {d['screenVsFrameMeanDifference']:.3f} levels at {d['screenSize'][0]}×{d['screenSize'][1]}" for d in diffs)
                + f"; output root {root} — {'PASS' if b12 else 'FAIL'}")
          ok &= b12
          sys.exit(0 if ok else 1)
          EOF
      # C1, C2, C5-C8 from the two performance runs.
      - name: Check the preview performance (C1, C2, C5-C8)
        run: |
          set -o pipefail
          python3 - "$HOME/Library/Logs/TrainCull" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, statistics, sys
          runs = {}
          for f in sorted(pathlib.Path(sys.argv[1]).glob("*.jsonl")):
              events = [json.loads(l) for l in f.read_text().splitlines()]
              start = [e for e in events if e["category"] == "perf" and e["message"].startswith("start")]
              if start:
                  runs["alpha2" if start[0]["fields"]["tuning"]["legacy"] else "new"] = events
          if set(runs) != {"new", "alpha2"}:
              print(f"- SPEC-RESULT C1–C8 (DNG): NOT RUN — perf runs found: {sorted(runs)}"); sys.exit(1)
          def of(events, cat): return [e.get("fields", {}) for e in events if e["category"] == cat]
          def mem(events, what): return next((m["footprintMB"] for m in of(events, "perf") if m.get("what") == what), None)
          ok = True
          n, o = runs["new"], runs["alpha2"]
          nd, od = of(n, "drag"), of(o, "drag")
          nsel = [r for r in of(n, "render") if "filterCreations" in r][0]
          osel = [r for r in of(o, "render") if "filterCreations" in r][0]
          # C1
          c1 = nsel["filterCreations"] == 1 and nd[0]["filterCreations"] == 0 and nd[1]["filterCreations"] == 0
          print(f"- SPEC-RESULT C1 decode reuse (DNG): this build {nsel['filterCreations']} Apple raw filter on selection, {nd[0]['filterCreations']} more during the 50-step drag at fit, {nd[1]['filterCreations']} at 100%; "
                f"alpha 2 path {osel['filterCreations']} on selection, {od[0]['filterCreations']} and {od[1]['filterCreations']} during the drags — {'PASS' if c1 else 'FAIL'}")
          ok &= c1
          # C2
          for i, where in [(0, "fit"), (1, "100%")]:
              a, b = nd[i], od[i]
              c2 = b["medianFrameMs"] > 0 and a["medianFrameMs"] <= b["medianFrameMs"] / 3
              print(f"- SPEC-RESULT C2 drag speed at {where} (DNG): this build median {a['medianFrameMs']:.0f} ms, p95 {a['p95FrameMs']:.0f}, max {a['maxFrameMs']:.0f} ({a['framesShown']} frames shown); "
                    f"alpha 2 path median {b['medianFrameMs']:.0f} ms, p95 {b['p95FrameMs']:.0f}, max {b['maxFrameMs']:.0f} ({b['framesShown']} shown); ratio {a['medianFrameMs'] / max(b['medianFrameMs'], 0.001):.2f} — {'PASS' if c2 else 'FAIL'}")
              ok &= c2
          # C5: frames shown in order, the settled frame for the final value
          def order(events):
              bad, last = 0, 0
              for p in of(events, "preview"):
                  if p["seq"] < last: bad += 1
                  last = max(last, p["seq"])
              return bad
          c5 = order(n) == 0 and all(d["settledMatchesFinal"] for d in nd[:2])
          print(f"- SPEC-RESULT C5 ordering (DNG): frames shown out of order {order(n)} (alpha 2 path {order(o)}); frames dropped in the 50-step drags {nd[0]['framesDropped']} at fit, {nd[1]['framesDropped']} at 100%; settled frame for the final value: {all(d['settledMatchesFinal'] for d in nd[:2])} — {'PASS' if c5 else 'FAIL'}")
          ok &= c5
          # C6
          for label, a, b in [("50-step drag at fit", nd[0]["peakMemoryMB"], od[0]["peakMemoryMB"]), ("50-step drag at 100%", nd[1]["peakMemoryMB"], od[1]["peakMemoryMB"]),
                              ("at 400%", mem(n, "at 400%, settled"), mem(o, "at 400%, settled"))]:
              c6 = a is not None and b is not None and a <= b / 2
              print(f"- SPEC-RESULT C6 memory {label} (DNG): this build {a:.0f} MB, alpha 2 path {b:.0f} MB ({a / b * 100:.0f}%) — {'PASS' if c6 else 'FAIL'}")
              ok &= c6
          # C7
          settles = [d for d in nd[2:7]]
          c7 = len(settles) == 5 and all(abs(d["releaseToSettleStartMs"] - d["tuning"]["settleDelay"] * 1000) <= 50 for d in settles)
          print("- SPEC-RESULT C7 settle delay (DNG): " + "; ".join(f"{d['tuning']['settleDelay']:.2f} s → settle started {d['releaseToSettleStartMs']:.0f} ms after release" for d in settles) + f" — {'PASS' if c7 else 'FAIL'}")
          rest = nd[7:]
          draft_off = next((d for d in rest if d["tuning"]["draftMode"] is False), None)
          size_flip = next((d for d in rest if d["tuning"]["viewSizeSettle"] != nd[0]["tuning"]["viewSizeSettle"]), None)
          region_off = next((d for d in rest if d["tuning"]["visibleRegion"] is False), None)
          drafts_off = [p for p in of(n, "preview") if p["tuning"]["draftMode"] is False and p["draft"] is True and p.get("draftMode") is False]
          took = draft_off is not None and size_flip is not None and region_off is not None and "full resolution" in region_off["settledWant"] \
              and (("full resolution" in size_flip["settledWant"]) != size_flip["tuning"]["viewSizeSettle"])
          print(f"- SPEC-RESULT C7 settings changed mid-session (DNG): draft mode off {draft_off is not None}; view-size settle flipped, settled as {size_flip and size_flip['settledWant']}; visible region off at 100%, settled as {region_off and region_off['settledWant']} — {'PASS' if took else 'FAIL'}")
          ok &= c7 and took
          # C8
          c8l = next((p for p in of(n, "perf") if "samples" in p), None)
          c8 = c8l is not None and c8l["samples"] > 0 and c8l["mismatches"] == 0
          print(f"- SPEC-RESULT C8 status label (DNG): {c8l and c8l['samples']} samples while a raw frame was on screen, {c8l and c8l['mismatches']} where the status didn't match — {'PASS' if c8 else 'FAIL'}")
          ok &= c8
          print(f"- (information) selection: first raw render this build {nsel['timeToFirstRawRenderMs']:.0f} ms, alpha 2 path {osel['timeToFirstRawRenderMs']:.0f} ms; release to settled at fit {nd[0]['releaseToSettledMs']:.0f} ms vs {od[0]['releaseToSettledMs']:.0f} ms")
          sys.exit(0 if ok else 1)
          EOF
      - name: Check the change log (T12)
        run: |
          set -o pipefail
          python3 - "$HOME/Library/Logs/TrainCull" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          folder = pathlib.Path(sys.argv[1])
          wanted = ["file", "control", "appleProperty", "oldValue", "newValue", "appleDefault", "readBackValue",
                    "renderMs", "peakMemoryMB", "zoom", "isDragEnd"]
          for log in sorted(folder.glob("*.jsonl")):
              events = [json.loads(l) for l in log.read_text().splitlines()]
              if not any(e["category"] == "script" for e in events):
                  continue
              changes = [e.get("fields", {}) for e in events if e["category"] == "change"]
              complete = [c for c in changes if all(k in c for k in wanted)]
              rendered = [c for c in complete if isinstance(c["renderMs"], (int, float)) and c["renderMs"] > 0]
              drags = [c for c in complete if c["isDragEnd"] is True]
              selections = [e for e in events if e["category"] == "raw" and e.get("fields", {}).get("file") == "SYNTHETIC.dng"]
              skipped = [e["message"] for e in events if e["category"] == "script" and "skipped" in e["message"]]
              ok = len(complete) >= 20 and len(rendered) == len(complete) and len(drags) == 2 and len(selections) == 1
              print(f"- SPEC-RESULT T12 logging (DNG): {len(changes)} change lines, {len(complete)} with every field, "
                    f"{len(rendered)} with renderMs > 0, {len(drags)} drag ends, {len(selections)} defaults line(s); "
                    f"skipped: {skipped or 'none'} — {'PASS' if ok else 'FAIL'}")
              for c in complete:
                  print(f"  - {c['control']}: {c['oldValue']:.3f} → {c['newValue']:.3f}, read back {c['readBackValue']}, "
                        f"{c['renderMs'] if c['renderMs'] is None else round(c['renderMs'])} ms, peak {c['peakMemoryMB'] if c['peakMemoryMB'] is None else round(c['peakMemoryMB'])} MB, zoom {c['zoom']}, drag end {c['isDragEnd']}")
              sys.exit(0 if ok else 1)
          print("- SPEC-RESULT T12 logging (DNG): NOT RUN — no scripted session in the logs")
          sys.exit(1)
          EOF
      # The app, kept with the build for two weeks; the publish job takes it from here.
      - uses: actions/upload-artifact@v4
        with:
          name: TrainCull
          retention-days: 14
          path: build/TrainCull.dmg
      # The pictures and logs are small, and never stop a build if storage is short.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: launch-screenshot
          retention-days: 14
          path: |
            build/launch.png
            build/launch-compare.png
            build/launch-edit.png
            build/launch-script.png
            build/launch-debug.png
            build/launch-debug-zoomed.png
            build/launch-perf.png
            build/launch-perf-alpha2.png
            build/logs
            ~/Pictures/TrainCull Debug
          if-no-files-found: ignore

  # A full release, not a pre-release, so that
  # https://github.com/<owner>/<repo>/releases/latest/download/TrainCull.dmg
  # always downloads the newest build. Only from main and from version tags.
  publish:
    name: Publish
    needs: [core-tests, mac]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: TrainCull
          path: build
      - name: Publish
        run: |
          TAG="${{ needs.mac.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already published"
            exit 0
          fi
          # A push to main of a commit that already has a version tag: the tag's own build publishes it.
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            TAGGED=$(gh api "repos/$GH_REPO/tags" --paginate --jq ".[] | select(.commit.sha == \"$GITHUB_SHA\") | .name" | grep '^v' || true)
            if [ -n "$TAGGED" ]; then
              echo "This commit is tagged $TAGGED; that tag's build publishes it."
              exit 0
            fi
          fi
          gh release create "$TAG" build/TrainCull.dmg \
            --latest \
            --target "$GITHUB_SHA" \
            --title "TrainCull ${{ needs.mac.outputs.release }}" \
